[project]
name = "jobpipe"
version = "0.2.2"
description = "Job-application assistant: Jobright job filtering and fact-grounded resume tailoring"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "docxtpl>=0.18",
    "python-docx>=1.1",
    "docx2pdf>=0.1.8",
    "pypdf>=4.2",
    "pypdfium2>=4.30",
    "pillow>=10.3",
    "playwright>=1.45",
    "gspread>=6.1",
    "anthropic>=1.14.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
jobpipe = "jobpipe.cli:app"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Word, network, or authenticated CLIs", "xlsx_only: list tests that use the default formats"]
addopts = "-m 'not integration'"
